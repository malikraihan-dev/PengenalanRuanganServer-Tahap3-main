# ===== SERVER ROOM MONITORING CONFIG =====
# JWT Secret Key (ganti di production)
monitor.jwt.secret=ServerMonitoringSecretKey2026!@#$%^&*()AbsensiRuanganTU
monitor.jwt.expiration-ms=86400000

# Face Recognition Threshold (0.0 - 1.0)
monitor.face.confidence-threshold=0.6

# Python Face Service (optional, for server-side processing)
monitor.face-service.url=http://localhost:5050
monitor.face-service.enabled=false

# Max file upload size (for face images)
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB

# ===== ARDUINO CONFIGURATION =====
# Arduino Serial Port Configuration
arduino.enabled=true
arduino.port=COM3
arduino.baudrate=9600
arduino.timeout=5000

# Arduino API Configuration
arduino.api.endpoint=http://localhost:8080/api/arduino
arduino.polling.interval=5000
arduino.polling.enabled=true

# ===== MQTT CONFIGURATION =====
# MQTT Broker
spring.mqtt.url=tcp://localhost:1883
spring.mqtt.username=ruangserver
spring.mqtt.password=admin123
spring.mqtt.client-id=ruangserver-server
spring.mqtt.default-topic=device/

# MQTT Topics
mqtt.topic.fingerprint=device/fingerprint/verify
mqtt.topic.fingerprint.enroll=device/fingerprint/enroll
mqtt.topic.sensor=device/sensor/data
mqtt.topic.status=device/status/+
mqtt.topic.logs=device/logs/access

# MQTT Connection
mqtt.broker.host=localhost
mqtt.broker.port=1883
mqtt.broker.enabled=true
